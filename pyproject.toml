[project]
name = "infiquetra-opencode-plugins"
version = "0.1.0"
description = "opencode-native adapter repo for selected Infiquetra Claude Code plugins"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.9.0",
  "mypy>=1.14.0",
  "types-pyyaml>=6.0.12.20260724",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  "plugins/*/scripts",
  "plugins/*/hooks",
  "plugins/*/references",
  "plugins/*/docs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "PLC", "RUF"]
ignore = ["PLC0415"]

[tool.mypy]
python_version = "3.12"
strict = true
